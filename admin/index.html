<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <link rel="shortcut icon" href="/img/trylogo2.png">
  <title>Admin Portal — Bɔ-Me-Nkɔmmɔ</title>
  <link rel="stylesheet" href="/css/font-awesome.min.css">
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
  <!-- Auth Gate Loading / Access State -->
  <div id="adm-gate" class="adm-auth-wrap">
    <div class="adm-auth-card" id="adm-gate-card">
      <h2 style="margin:0 0 8px;font-size:18px;">Verifying Administrator Session...</h2>
      <p style="margin:0;color:#64748b;">Connecting to Supabase Auth and checking role permissions.</p>
    </div>
  </div>

  <!-- Authenticated Admin Workspace -->
  <div id="adm-app" class="adm-shell" style="display:none;">
    <aside class="adm-sidebar" id="adm-sidebar">
      <div class="adm-brand">
        <img src="/img/trylogo2.png" alt="Logo">
        <span>Bɔ-Me-Nkɔmmɔ CMS</span>
      </div>

      <nav id="adm-nav"></nav>

      <div class="adm-sidebar-footer">
        <a href="/index.html" target="_blank" rel="noopener noreferrer" class="adm-nav-item">
          <span class="adm-nav-left"><i class="fa fa-external-link" aria-hidden="true"></i> View Live Site</span>
        </a>
        <button type="button" id="adm-logout-btn" class="adm-nav-item" style="color:#fca5a5;">
          <span class="adm-nav-left"><i class="fa fa-sign-out" aria-hidden="true"></i> Sign Out</span>
        </button>
      </div>
    </aside>

    <div class="adm-main">
      <header class="adm-topbar">
        <div class="adm-topbar-left">
          <button type="button" class="adm-mobile-btn" id="adm-mobile-btn" aria-label="Toggle sidebar">
            <i class="fa fa-bars" aria-hidden="true"></i>
          </button>
          <div>
            <h1 class="adm-breadcrumb" id="adm-page-title">Overview</h1>
            <span id="adm-role-label" style="font-size:12px;color:#64748b;"></span>
          </div>
        </div>

        <div class="adm-topbar-right">
          <button type="button" class="adm-icon-btn" id="adm-notif-btn" aria-label="Notifications">
            <i class="fa fa-bell-o" aria-hidden="true"></i>
            <span class="adm-notif-count" id="adm-notif-badge" style="display:none;">0</span>
          </button>

          <div class="adm-notif-panel" id="adm-notif-panel">
            <div style="padding:12px 14px;border-bottom:1px solid #e2e8f0;display:flex;justify-content:space-between;align-items:center;">
              <strong style="font-size:13px;">Notifications</strong>
              <button type="button" class="adm-btn adm-btn-secondary adm-btn-sm" id="adm-mark-all-read">Mark all read</button>
            </div>
            <div id="adm-notif-list"></div>
          </div>

          <button type="button" class="adm-btn adm-btn-secondary" id="adm-profile-btn">
            <i class="fa fa-user-circle-o" aria-hidden="true"></i>
            <span id="adm-user-name">Profile</span>
          </button>
        </div>
      </header>

      <main class="adm-content" id="adm-view"></main>
    </div>
  </div>

  <!-- Reusable Modal -->
  <div class="adm-modal-backdrop" id="adm-modal-backdrop" role="dialog" aria-modal="true">
    <div class="adm-modal">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;">
        <h2 id="adm-modal-title" style="margin:0;font-size:18px;">Modal</h2>
        <button type="button" class="adm-icon-btn" id="adm-modal-close" aria-label="Close modal">
          <i class="fa fa-times" aria-hidden="true"></i>
        </button>
      </div>
      <div id="adm-modal-body"></div>
    </div>
  </div>

  <script src="/js/vendor/supabase.js"></script>
  <script src="/js/supabase-client.js"></script>
  <script src="/admin/admin.js"></script>
</body>
</html>
